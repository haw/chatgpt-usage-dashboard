name: Terraform

# Static checks only, without AWS credentials. Plan and apply are run by a person from the
# tools container (`make tf-plan` / `make tf-apply`); CI holds no role that can change infrastructure.

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform -chdir=bootstrap init -backend=false
      - run: terraform -chdir=bootstrap validate

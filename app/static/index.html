<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Usage Monitor</title><link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">WORKSPACE ANALYTICS</p><h1>ChatGPT Usage Monitor</h1><p class="subtitle">チームの利用状況と異常兆候を、日次データから確認します。</p></div><div id="status" class="status"><span class="status-dot"></span><span>読み込み中</span></div></header>
  <main>
    <section id="notice" class="notice hidden"></section>
    <section class="kpis" aria-label="主要指標">
      <article class="card kpi"><span>アクティブユーザー</span><strong id="active-users">—</strong><small>直近の保存データ</small></article>
      <article class="card kpi"><span>総利用量</span><strong id="total-activity">—</strong><small>取得指標の合計</small></article>
      <article class="card kpi"><span>1日平均</span><strong id="daily-average">—</strong><small>期間内平均</small></article>
      <article class="card kpi alert-kpi"><span>要確認</span><strong id="alert-count">—</strong><small>自動検出された兆候</small></article>
    </section>
    <section class="grid two-columns">
      <article class="card panel"><div class="panel-heading"><div><p class="eyebrow">TREND</p><h2>日次利用推移</h2></div><span id="period" class="chip">7日間</span></div><div id="daily-chart" class="bar-chart empty">データがありません</div></article>
      <article class="card panel"><div class="panel-heading"><div><p class="eyebrow">PRODUCTS</p><h2>製品別内訳</h2></div></div><div id="products" class="product-list empty">データがありません</div></article>
    </section>
    <section class="card panel"><div class="panel-heading"><div><p class="eyebrow">MEMBERS</p><h2>ユーザー別利用状況</h2></div><span id="user-count" class="chip">0 users</span></div><div class="table-wrap"><table><thead><tr><th>ユーザー</th><th>利用量</th><th>構成比</th><th>直近推移</th></tr></thead><tbody id="users"></tbody></table></div></section>
    <section class="card panel"><div class="panel-heading"><div><p class="eyebrow warning">SIGNALS</p><h2>要確認の利用兆候</h2></div></div><div id="alerts" class="alerts empty">異常兆候はありません</div></section>
  </main>
  <footer><span>集計値は監査ログではありません。</span><span id="last-updated">未収集</span></footer>
  <script src="/static/app.js" defer></script>
</body></html>

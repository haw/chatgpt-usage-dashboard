<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン — ChatGPT Usage Monitor</title><link rel="stylesheet" href="/static/vendor/material-design-icons/filled.css"><link rel="stylesheet" href="/static/styles.css?v=72"><link rel="stylesheet" href="/static/range.css?v=72"></head>
<body>
<header><div><p class="eyebrow">USAGE ANALYTICS</p><h1>ChatGPT Usage Monitor</h1><p>集計JSONから、普段と違う日を見つけ、推移と文脈を確かめます。</p></div></header>
<main class="login-main">
  <section class="card panel login-card">
    <p class="eyebrow">SIGN IN</p>
    <h2>社内アカウントでログイン</h2>
    <p id="login-notice" class="message hidden" role="status"></p>
    <p class="muted">会社の Google Workspace アカウント（<span id="login-domains">社内ドメイン</span>）でログインします。それ以外のアカウントは利用できません。</p>
    <a id="login-button" href="/login/google" class="login-button"><span class="material-icons" aria-hidden="true">login</span>Google でログイン</a>
  </section>
</main>
<footer><span>表示は推定であり、不正利用や制限到達を断定するものではありません。</span><span></span></footer>
<script>
  // Messages come from the query string so the page itself stays static: ?logged_out=1, ?error=domain&email=..., ?error=oauth&detail=...
  const params = new URLSearchParams(location.search);
  const notice = document.getElementById('login-notice');
  const show = (text, kind) => { notice.textContent = text; notice.className = `message ${kind}`; };
  if (params.get('logged_out')) show('ログアウトしました。Google アカウント自体からはログアウトしていません。', 'success');
  else if (params.get('error') === 'domain') show(`${params.get('email') || 'このアカウント'} は許可されたドメインではありません。別のアカウントでログインしてください。`, 'error');
  else if (params.get('error') === 'oauth') show(`ログインに失敗しました${params.get('detail') ? `（${params.get('detail')}）` : ''}。もう一度お試しください。`, 'error');
  fetch('/api/me').then(r => r.ok ? r.json() : null).then(me => {
    if (me && me.domains && me.domains.length) document.getElementById('login-domains').textContent = me.domains.map(d => `@${d}`).join('、');
    if (me && me.user) location.replace('/');
  }).catch(() => {});
</script>
</body></html>

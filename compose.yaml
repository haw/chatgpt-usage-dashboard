services:
  dashboard:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./plugins:/app/plugins:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  # React frontend (Vite dev server). API calls are proxied to the dashboard service;
  # the Host header is passed through so the OAuth callback stays on localhost:5180.
  # Runs as root: node_modules lives in a named volume, sources are read from the bind mount.
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY: http://dashboard:8000
      npm_config_cache: /tmp/npm-cache
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      dashboard:
        condition: service_healthy
    init: true

  collector:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "-m", "app"]
    command: ["collect", "--days", "7"]
    init: true

  test:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    entrypoint: ["sh", "-c"]
    command: ["cp -a /workspace /tmp/project && cd /tmp/project && pip install --no-cache-dir '.[dev]' >/dev/null && pytest"]

volumes:
  frontend_node_modules:

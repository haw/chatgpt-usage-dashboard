services:
  dashboard:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      APP_GIT_DIR: /repo/.git   # local builds show the checked-out commit after the version (1.0.0+<8 chars>)
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.git:/repo/.git:ro
      - ./config:/app/config:ro
      - ./plugins:/app/plugins:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  # React frontend (Vite dev server). API calls are proxied to the dashboard service;
  # the Host header is passed through so the OAuth callback stays on localhost:5180.
  # Runs as root: node_modules lives in a named volume, sources are read from the bind mount.
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY: http://dashboard:8000
      APP_GIT_DIR: /repo/.git
      npm_config_cache: /tmp/npm-cache
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./.git:/repo/.git:ro
    depends_on:
      dashboard:
        condition: service_healthy
    init: true

  # Terraform + AWS CLI (infra/terraform). The AWS access key lives only in the `aws_credentials` volume,
  # not in the host's ~/.aws, and the container cannot see the host's other AWS profiles:
  #   make aws-configure      # once; stored in the volume
  #   make tf-plan            # see the tf-* targets in the Makefile
  terraform:
    build:
      context: ./infra/terraform
      args:
        UID: ${LOCAL_UID:-1000}
        GID: ${LOCAL_GID:-1000}
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/infra/terraform
    environment:
      HOME: /home/tf
      AWS_PROFILE:
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-1}
      TF_IN_AUTOMATION: "1"
    volumes:
      - .:/workspace
      - aws_credentials:/home/tf/.aws

  test:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    entrypoint: ["sh", "-c"]
    command: ["cp -a /workspace /tmp/project && cd /tmp/project && pip install --no-cache-dir '.[dev]' >/dev/null && pytest"]

  # Frontend checks in containers: `make test-frontend`. test-api is the API without login and with
  # throwaway data; frontend-test loads the synthetic fixtures into it, then runs typecheck and vitest.
  test-api:
    build: .
    profiles: ["tools"]
    environment:
      AUTH_MODE: none
      STORAGE_BACKEND: local
      DATA_DIR: /tmp/data
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend-test:
    image: node:24-alpine
    profiles: ["tools"]
    working_dir: /app
    environment:
      BACKEND: http://test-api:8000
      FIXTURES: /tests/fixtures
      npm_config_cache: /tmp/npm-cache
    command: sh -c "npm ci --no-audit --no-fund && node scripts/seed-test-api.mjs && npm run typecheck && npm test"
    volumes:
      - ./frontend:/app
      - frontend_test_node_modules:/app/node_modules
      - ./tests/fixtures:/tests/fixtures:ro
    depends_on:
      test-api:
        condition: service_healthy
    init: true

volumes:
  frontend_node_modules:
  frontend_test_node_modules:
  aws_credentials:

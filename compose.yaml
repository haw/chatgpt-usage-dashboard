services:
  dashboard:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./plugins:/app/plugins:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  # React frontend (Vite dev server). API calls are proxied to the dashboard service;
  # the Host header is passed through so the OAuth callback stays on localhost:5180.
  # Runs as root: node_modules lives in a named volume, sources are read from the bind mount.
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY: http://dashboard:8000
      npm_config_cache: /tmp/npm-cache
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      dashboard:
        condition: service_healthy
    init: true

  # Terraform + AWS CLI (infra/terraform). The AWS access key lives only in the `aws_credentials` volume,
  # not in the host's ~/.aws, and the container cannot see the host's other AWS profiles:
  #   docker compose run --rm terraform aws configure      # once; stored in the volume
  #   docker compose run --rm terraform terraform plan -var-file=envs/prod.tfvars
  terraform:
    build:
      context: ./infra/terraform
      args:
        UID: ${LOCAL_UID:-1000}
        GID: ${LOCAL_GID:-1000}
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/infra/terraform
    environment:
      HOME: /home/tf
      AWS_PROFILE:
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-1}
      TF_IN_AUTOMATION: "1"
    volumes:
      - .:/workspace
      - aws_credentials:/home/tf/.aws

  test:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    entrypoint: ["sh", "-c"]
    command: ["cp -a /workspace /tmp/project && cd /tmp/project && pip install --no-cache-dir '.[dev]' >/dev/null && pytest"]

volumes:
  frontend_node_modules:
  aws_credentials:

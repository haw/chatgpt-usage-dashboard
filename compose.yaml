services:
  dashboard:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  collector:
    build: .
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "-m", "app"]
    command: ["collect", "--days", "7"]
    init: true

  test:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    entrypoint: ["sh", "-c"]
    command: ["cp -a /workspace /tmp/project && cd /tmp/project && pip install --no-cache-dir '.[dev]' >/dev/null && pytest"]

[project]
name = "chatgpt-usage-dashboard"
version = "0.1.0"
description = "Local-first ChatGPT workspace usage dashboard"
requires-python = ">=3.12"
dependencies = [
  "authlib==1.6.5",
  "boto3==1.40.45",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "python-dotenv==1.1.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "respx==0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.coverage.run]
source = ["app"]
